model: coding-image
engine:
  template: comfyui
  model: flux2-klein
  params:
    active_model: flux2-klein
    port: 8188
    kind: image
    workflow_templates: [flux-txt2img, flux-img2img]
  container:
    name: comfyui-rocm
    image: ${COMFYUI_ROCM_IMAGE}   # local build — `stackctl build coding-image`
    build:
      context: /app/stackd/imagegen/comfyui_image   # shipped inside the stackd image
      dockerfile: Dockerfile.igpu
      args:
        ROCM_BASE: ${COMFYUI_ROCM_BASE}   # rocm/pytorch base tag — the ROCm/PyTorch version
        COMFYUI_REF: ${COMFYUI_ROCM_REF}  # ComfyUI git ref (pin to a commit for reproducible builds)
    ipc_host: true
    devices: ["/dev/kfd"]               # + /dev/dri/renderD128 from the vulkan device_profile
    shm_size: "8g"
    env:
      TZ: ${TZ}
      HSA_OVERRIDE_GFX_VERSION: "${HSA_GFX_VERSION}"
      HSA_VISIBLE_DEVICES: "0"
      HIP_VISIBLE_DEVICES: "0"
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      MIOPEN_FIND_MODE: FAST
    mounts:
      - { host_path: ${DOCKERDIR}/appdata/comfyui/models,      container_path: /opt/ComfyUI/models, ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui-igpu/user,   container_path: /opt/ComfyUI/user,   ro: false }
      # shared scratch — only one ComfyUI runs at a time
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/output, container_path: /opt/ComfyUI/output, ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/input,  container_path: /opt/ComfyUI/input,  ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/temp,   container_path: /opt/ComfyUI/temp,   ro: false }
    # Same shared comfyui.<domain> router as everyday-image.yaml (only one of the
    # two ComfyUIs is ever running, so publishing the same router/service is fine).
    labels:
      traefik.enable: "true"
      traefik.http.routers.comfyui-rtr.entrypoints: "https"
      traefik.http.routers.comfyui-rtr.rule: "Host(`comfyui.${DOMAINNAME_CLOUD_SERVER}`)"
      traefik.http.routers.comfyui-rtr.middlewares: "chain-oauth-comfyui@file"
      traefik.http.routers.comfyui-local-rtr.entrypoints: "https"
      traefik.http.routers.comfyui-local-rtr.rule: "Host(`comfyui.${DOMAINNAME_LOCAL_SERVER}`)"
      traefik.http.routers.comfyui-local-rtr.middlewares: "chain-no-auth-local-only-comfyui@file"
      traefik.http.routers.comfyui-rtr.service: "comfyui-svc"
      traefik.http.routers.comfyui-local-rtr.service: "comfyui-svc"
      traefik.http.services.comfyui-svc.loadbalancer.server.port: "8188"
budget: { vram_gib: 20, ram_gib: 0 }      # Flux.2 Klein on ROCm; unified RAM, counted once
placement: { devices: [igpu0] }
serves: []
