model: chat
engine:
  template: llamacpp-cuda
  model: Qwen3.8-27B-UD-Q4_K_XL
  params:
    ctx: 262144
    parallel: 4
    # quantised KV (q8_0/q4_0) is why this measures ~30 GiB @ 262144, not ~38.
    # flash-attn / kv-unified / cont-batching are added by the engine template.
    extra_args: ["-ctk", "q8_0", "-ctv", "q4_0",
                 "--spec-type", "draft-mtp", "--spec-draft-n-max", "4",
                 "--reasoning", "on", "--reasoning-effort", "low", "--reasoning-budget", "16384",
                 "-n", "32768",
                 "--mmproj", "/models/Qwen3.8-27B-UD-Q4_K_XL.mmproj-BF16.gguf"]
  container:
    image: ${LLAMACPP_CUDA_IMAGE}
    build:
      context: /app/stackd/llamacpp_image   # shipped inside the stackd image
      dockerfile: Dockerfile.cuda           # `docker exec stackd stackctl build chat` produces it
budget: { vram_gib: 30, ram_gib: 2 }     # fallback if catalog/ has no curve
placement: { devices: [cuda0] }
# `reasoning:` is stackd's engine-agnostic knob — the front translates it to the
# dialect of whichever engine serves the call (llama.cpp reasoning_effort/budget,
# vLLM chat_template_kwargs.enable_thinking), so these names work even when a
# vLLM stand-in answers them. `off` | <effort> | { effort: <e>, budget: <n> }.
serves:
  - { api_name: assistant,         preset: {} }
  - { api_name: assistant-nothink, preset: { reasoning: off } }
  - { api_name: assistant-low,     preset: { reasoning: { effort: low, budget: 4096 } } }
  - { api_name: assistant-med,     preset: { reasoning: { effort: medium } } }
  - { api_name: assistant-xhigh,   preset: { reasoning: { effort: xhigh } } }
