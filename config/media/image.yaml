# image — the elastic image-generation tier.
#
# stackd runs ONE ComfyUI in whatever device capacity is left after the active
# profile's LLM models are placed (it never displaces an LLM engine). The
# checkpoint it loads is chosen at runtime from `prefer:` below, not fixed here;
# it stays put until the profile changes or someone asks for a capability the
# resident model can't serve.
kind: image
margin_gib: 4            # headroom safety cushion subtracted from each device's free VRAM

# How to run the ComfyUI engine, one block per stackd device backend (cuda /
# vulkan — the vulkan block is a ROCm build, but the iGPU device is `vulkan` in
# stackd's model). The tier picks the backend from the device it lands on (see
# prefer[].backends) and creates that container. Same ContainerSpec schema as a
# model's `container:` block; env-var placeholders resolve at load.
containers:
  cuda:
    name: comfyui-cuda
    image: ${COMFYUI_CUDA_IMAGE}
    ipc_host: true
    env:
      TZ: ${TZ}
      # NO --highvram (see the eGPU/ReBAR note): a generate touches TE (~17G),
      # UNET (~34G), VAE one at a time; --reserve-vram 4 keeps a cushion.
      # --disable-xformers (2026-09-22, qwen-image-2.1 on Blackwell SM120): the
      # megapak bundles xformers and ComfyUI v0.37.0 selects it as the global
      # attention; its FMHA dispatch has NO operator for tensor-bias attention on
      # capability 12.0 (fa3/cutlass build for <=9.0, fa2 refuses tensor bias) and
      # attention_xformers has no fallback — qwen's masked TE attention hard-failed
      # in 0.04s. Disabling xformers falls through to PyTorch SDPA, the exact path
      # the ROCm build (no xformers installed) runs, where all three qwen graphs
      # work. Trade: other cuda models also take SDPA instead of xformers (fast on
      # SM120 via cuDNN; it is what the vulkan tier already runs).
      CLI_ARGS: "--reserve-vram 4 --disable-xformers"
    mounts:
      - { host_path: ${DOCKERDIR}/appdata/comfyui/models,        container_path: /root/ComfyUI/models, ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/custom_nodes,  container_path: /root/ComfyUI/custom_nodes, ro: false }
      - { host_path: ${STACKD_SRC}/stackd/imagegen/comfyui_image/clipseg_mask.py, container_path: /root/ComfyUI/custom_nodes/clipseg_mask.py, ro: true }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/output, container_path: /root/ComfyUI/output, ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/input,  container_path: /root/ComfyUI/input,  ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/temp,   container_path: /root/ComfyUI/temp,   ro: false }
    # container.labels: {} — the generic config assumes localhost. Behind a
    # reverse proxy, add router labels here (env vars expand at create time).

  vulkan:
    name: comfyui-rocm
    image: ${COMFYUI_ROCM_IMAGE}      # local build — `stackctl build` produces it
    build:
      context: /app/stackd/imagegen/comfyui_image   # shipped inside the stackd image
      dockerfile: Dockerfile.igpu
      args:
        ROCM_BASE: ${COMFYUI_ROCM_BASE}   # rocm/pytorch base tag
        COMFYUI_REF: ${COMFYUI_ROCM_REF}  # ComfyUI git ref (pin for reproducible builds)
    ipc_host: true
    devices: ["/dev/kfd"]               # + the vulkan device_profile's render node
    shm_size: "8g"
    env:
      TZ: ${TZ}
      HSA_OVERRIDE_GFX_VERSION: "${HSA_GFX_VERSION}"
      HSA_VISIBLE_DEVICES: "0"
      HIP_VISIBLE_DEVICES: "0"
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      MIOPEN_FIND_MODE: FAST
    mounts:
      - { host_path: ${DOCKERDIR}/appdata/comfyui/models,      container_path: /opt/ComfyUI/models, ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui-igpu/user,   container_path: /opt/ComfyUI/user,   ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/output, container_path: /opt/ComfyUI/output, ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/input,  container_path: /opt/ComfyUI/input,  ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/temp,   container_path: /opt/ComfyUI/temp,   ro: false }

# Load order. stackd loads the first entry whose backend matches the device it
# lands on and whose footprint fits that device's free VRAM. A capability request
# the resident entry can't serve escalates to the first *capable* entry that fits;
# if only a smaller one fits, it loads that and says so in the response.
#   capabilities: must each have a graph for active_model in
#                 imagegen/workflow_graphs/models.json (checked at load)
#   footprint_gib: a VRAM estimate per backend — refine with `stackctl bench`
prefer:
  - active_model: flux2-dev-turbo
    capabilities: [generate, stylize, edit]
    backends: [cuda]
    footprint_gib: { cuda: 34 }
  - active_model: flux2-klein
    capabilities: [generate, stylize, edit]
    backends: [cuda, vulkan]
    footprint_gib: { cuda: 24, vulkan: 20 }
  # generate-only specialist (typography / text-in-image). Last in the list, so
  # it's only auto-picked when the others don't fit — reach it explicitly with
  # `image_model: ideogram4` or `stackctl image use ideogram4`. Needs the
  # ideogram4 + Qwen3-VL + flux2-vae checkpoints in the models dir.
  - active_model: ideogram4
    capabilities: [generate]
    backends: [cuda]
    footprint_gib: { cuda: 34 }
  # Qwen-Image 2.1 (Comfy-Org repack: int8-convrot DiT + int8 Qwen3-VL 8B encoder + bf16
  # VAE, ~16.1G on disk), generate + stylize + whole-image edit. Explicit-selection only
  # (last in the ladder, the ideogram4 convention): `image_model: qwen` or
  # `stackctl image use qwen-image-2-1`. Needs ComfyUI >= v0.37.0 (TextEncodeQwenImage21)
  # and the three qwen files in the shared models dir. CUDA enabled 2026-09-22 via a
  # COMFYUI_CUDA_IMAGE at exactly v0.37.0 (cu130-megapak-pt211-20260921); on the
  # deployed box cuda0 belongs to the resident LLM, so cuda qwen loads only when the
  # profile frees the card (e.g. bench-image).
  # NUMBERS = bench 2026-09-22 (two runs, -c37 image). The FIRST run's numbers
  # (footprint 10 / host_ram 36) came from `stackctl image bench` cgroup-PEAK
  # 32.23G measured --force --unsafe while flash-next was live-resident — and were
  # WRONG METRIC: the guard compares host_ram_gib against MemAvailable, which
  # EXCLUDES reclaimable page cache, while cgroup peak INCLUDES the ~17G of
  # mmap'd safetensors pages a load touches. The mismatch made qwen refuse under
  # chat-code-img at 34.6G free (2026-09-22, user-visible). RECALIBRATED from a
  # cold load + warmup + 1024² gen with 2s cgroup sampling splitting memory.stat:
  # peak ANON 14.32G (the real commit), cgroup-total 31.2G, host MemAvailable dip
  # to 49.4G. host_ram = anon peak + 3G cushion (+1 for sample aliasing) = 18.
  # footprint 13 = bench's own GTT suggestion on the cold run (was 10, warm-only).
  # If a fresh-spawn load ever OOMs, raise footprint toward ~20; the guard
  # re-reads real MemAvailable on every pick/swap meanwhile.
  - active_model: qwen-image-2-1
    capabilities: [generate, stylize, edit]
    backends: [cuda, vulkan]   # cuda first (2026-09-22): tried first, refuses when
                               # the resident LLM left < 20G cuda headroom (the
                               # tier never evicts an LLM), falls back to vulkan
                               # which always has the iGPU. First-fit-wins, the
                               # klein convention.
    # cuda = 2026-09-22 MEASURED on the 0921 megapak (exact v0.37.0, --disable-xformers):
    # cold set 15.19G VRAM + 2K activations 2.06G = ~17.3 peak -> 20 with cushion.
    # (The bench's own 48-50 suggestion is contaminated: the auto-scheduler had
    # dev-turbo loading in the same container first, so its "baseline VRAM" was 30G
    # and its "footprint" double-counted that. The per-run "added" column is the
    # honest delta, exactly the raw-peak-vs-baseline-delta trap the vulkan notes
    # warn about.) NO cuda host_ram_gib, same as klein/ideogram/dev-turbo: on cuda
    # the VRAM footprint is the constraint and the --reserve-vram staging is
    # reclaimable page cache (measured whole-machine delta <= 1.7G).
    footprint_gib: { vulkan: 13, cuda: 20 }
    host_ram_gib: { vulkan: 18 }
