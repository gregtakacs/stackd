# config/media/audio.yaml — the elastic AUDIO tier: music (YuE2) in its OWN
# ComfyUI, so a song never swaps the image tier's pipeline out (and an image never
# swaps music out). Loaded on demand — only for a profile with `audio: cold`; under
# `audio: none` (the default) music keeps running inside the image tier's container
# (yue2 stays in image.yaml for that), which is the cheap path when both share one
# GPU's ComfyUI anyway (measured 2026-11-03: +4 s / +14 s per switch on the iGPU,
# vs +111 s / +38 s when switching between the RTX and the iGPU).
#
# Placement: whatever headroom is left after the LLMs AND the resident image slot's
# footprint; never a CUDA card that already runs the image tier's ComfyUI (two
# ComfyUIs would both fill it with dynamic VRAM) — see reconciler._tier_headroom.
#
# Containers are copies of image.yaml's with their own names, their own temp dir
# (ComfyUI empties its temp dir at start — a shared one would eat the other's
# in-flight files) and, on rocm, their own user dir. No traefik labels: the
# ComfyUI web UI stays on the image tier's container.
kind: audio
margin_gib: 4

containers:
  cuda:
    name: comfyui-audio-cuda
    image: ${COMFYUI_CUDA_IMAGE}
    ipc_host: true
    env:
      TZ: ${TZ}
      CLI_ARGS: "--reserve-vram 4 --disable-xformers"
    mounts:
      - { host_path: ${DOCKERDIR}/appdata/comfyui/models,        container_path: /root/ComfyUI/models, ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/custom_nodes,  container_path: /root/ComfyUI/custom_nodes, ro: false }
      - { host_path: ${STACKD_SRC}/stackd/imagegen/comfyui_image/clipseg_mask.py, container_path: /root/ComfyUI/custom_nodes/clipseg_mask.py, ro: true }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/output, container_path: /root/ComfyUI/output, ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/input,  container_path: /root/ComfyUI/input,  ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/audio-temp,   container_path: /root/ComfyUI/temp,   ro: false }

  vulkan:
    name: comfyui-audio-rocm
    image: ${COMFYUI_ROCM_IMAGE}
    build:
      context: /app/stackd/imagegen/comfyui_image
      dockerfile: Dockerfile.igpu
      args:
        ROCM_BASE: ${COMFYUI_ROCM_BASE}
        COMFYUI_REF: ${COMFYUI_ROCM_REF}
    ipc_host: true
    devices: ["/dev/kfd"]
    shm_size: "8g"
    env:
      TZ: ${TZ}
      HSA_OVERRIDE_GFX_VERSION: "${HSA_GFX_VERSION}"
      HSA_VISIBLE_DEVICES: "0"
      HIP_VISIBLE_DEVICES: "0"
      TORCH_ROCM_AOTRITON_ENABLE_EXPERIMENTAL: "1"
      MIOPEN_FIND_MODE: FAST
    mounts:
      - { host_path: ${DOCKERDIR}/appdata/comfyui/models,      container_path: /opt/ComfyUI/models, ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui-igpu-audio/user,   container_path: /opt/ComfyUI/user,   ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/output, container_path: /opt/ComfyUI/output, ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/input,  container_path: /opt/ComfyUI/input,  ro: false }
      - { host_path: ${DOCKERDIR}/appdata/comfyui/scratch/audio-temp,   container_path: /opt/ComfyUI/temp,   ro: false }

prefer:
  - active_model: yue2
    capabilities: [compose, cover]
    backends: [cuda, vulkan]
    explicit_only: true
    footprint_gib: { cuda: 5, vulkan: 10 }
    host_ram_gib: { vulkan: 10 }
