profile: coding
priority: 500             # outranks everyday; may evict it, never the reverse
idle_evict: 45m          # revert to the default profile after this idle span
# coding-flash's serves include "assistant*", so it stands in for chat.
# everyday-autocomplete is listed here too -> the solver places it on igpu0 with
# the same identity as under `everyday`, so a switch leaves it running untouched.
models:
  - coding-flash
  - coding-image
  - everyday-autocomplete
