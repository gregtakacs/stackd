[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stackd"
version = "0.0.1"
description = "Two-device model stack/profile orchestrator"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]
# The embedded image-generation MCP tools (stackd/imagegen/). Kept out of the core so
# `import stackd.*` and the stdlib-only smoke suite need nothing but pyyaml.
imagegen = [
    "mcp>=2.0.0",
    "httpx>=0.27",
    "pillow>=10",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "anyio>=4",
]

[project.scripts]
stackctl = "stackd.cli:main"

[tool.setuptools.packages.find]
include = ["stackd*"]

[tool.setuptools.package-data]
"stackd" = ["web/*.html", "web/vendor/*"]
# The toolbox editor is served by stackd itself (see stackd/toolbox/web.py), so its
# assets must ship inside the wheel like the dashboard's do — the daemon reads them from
# the package directory, and a missing entry here means a 404 embed in the container that
# works fine on a bind-mounted checkout.
"stackd.toolbox" = ["web/*.html", "web/*.js", "web/*.css"]
"stackd.imagegen" = [
    "workflow_graphs/**/*.json", "tool_docs/*.md", "prompts/*.txt",
    "comfyui_image/*",
]
